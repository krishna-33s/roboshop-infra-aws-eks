apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: roboshop
  # this labels is for replicaset
  labels:
    project: roboshop
    tier: backend
    component: shipping
    environment: dev
  annotations:
    kubernetes.io/change-cause: {{ .Values.deployment.cause }}  
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      # these labels is for replicaset to select the pods
      project: roboshop
      tier: backend
      component: shipping
      environment: dev
  template:
    metadata:
    # these for pod defination
      labels:
        project: roboshop
        tier: backend
        component: shipping
        environment: dev
    spec:
      containers:
      - name: shipping
        image: "{{ .Values.deployment.image }}:{{ .Values.deployment.imageVersion }}"
        imagePullPolicy: Always
        resources:
          requests:
            memory: "256Mi"
            cpu: "180m"
          limits:
            memory: "256Mi"
            cpu: "180m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 4
          periodSeconds: 10
          initialDelaySeconds: 15   
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 25
          periodSeconds: 10    
        livenessProbe: 
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 4
          periodSeconds: 10   
        envFrom:
        - configMapRef:
            name: shipping-configmap
