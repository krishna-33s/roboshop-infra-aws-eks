apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop
    tier: frontend
    component: nginx
    environment: dev
spec:
  type: LoadBalancer
  selector:
      project: roboshop
      tier: frontend
      component: nginx
      environment: dev

  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

