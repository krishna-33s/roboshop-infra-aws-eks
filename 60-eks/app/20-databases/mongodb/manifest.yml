apiVersion: v1
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: mongodb
    environment: dev
spec:
  clusterIP: None
  selector:
    project: roboshop
    tier: database
    component: mongodb
    environment: dev
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017  
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: mongodb
    environment: dev
spec:
  selector:
    matchLabels:
      project: roboshop
      tier: database
      component: mongodb
      environment: dev # has to match .spec.template.metadata.labels
  serviceName: "mongodb-headless"
  #replicas: 4
  replicas: 1 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        project: roboshop
        tier: database
        component: mongodb
        environment: dev # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: mongodb
        image: krishna88s/mongodb:1.1.0
        volumeMounts:
        - name: mongodb
          mountPath: /data/db
  #PVC         
  volumeClaimTemplates:
  - metadata:
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    tier: database
    component: mongodb
    environment: dev
spec:
  selector:
    project: roboshop
    tier: database
    component: mongodb
    environment: dev
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017          